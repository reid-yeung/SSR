stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov3withNorm'
    encoder_config_path: 'models/dinov3b'
    encoder_input_size: 256
    encoder_params:
      dinov3_path: 'models/dinov3b'
      normalize: true
      # Create LoRA modules at initialization; training starts after the decoder-only warmup.
      lora:
        enabled: true
        r: 32
        lora_alpha: 64
        target_modules: ["up_proj", "down_proj"]
        lora_dropout: 0.05
        bias: "none"
    decoder_config_path: 'configs/decoder/ViTXL/config.yaml'
    noise_tau: 0.8
    reshape_to_2d: true
training:
  epochs: 30
  ema_decay: 0.9978
  global_batch_size: 512
  num_workers: 8
  clip_grad: 0.0
  log_interval: 100
  checkpoint_interval: 1
  sample_every: 2500
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 30
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: true

encoder_training:
  enabled: true
  start_epoch: 12
  lr_mult: 1.0
  mode: lora

distill:
  enabled: true
  start_epoch: 12
  weight: 1.0
  teacher_path: ''
  normalize: true
  loss_type: mse

struct_align:
  enabled: true
  use_patch_affinity: true
  layers: [6, 8, 10, 12]
  layer_weights: [0.25, 0.5, 0.75, 1.0]
  start_epoch: 12
  weight: 50
  warmup_steps: 5000
  warmup_schedule: cosine
  teacher_path: ''
  normalize: true
  temperature: 1.0
  loss_type: mse

ghpf_align:
  enabled: true
  start_epoch: 12
  weight: 0.01
  warmup_steps: 5000
  warmup_schedule: cosine
  teacher_path: ''
  normalize: true
  loss_type: cosine
  cutoff_ratio: 0.05
  layers: [8, 10, 12]
  layer_weights: [0.25, 0.5, 1.0]

gan:
  disc:
    arch:
      dino_ckpt_path: 'models/discs/dino_vit_small_patch8_224.pth'
      ks: 9
      norm_type: 'bn'
      using_spec_norm: true
      recipe: 'S_8'
    optimizer:
      lr: 2.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 1
      decay_end_epoch: 30
      base_lr: 2.0e-4
      final_lr: 2.0e-5
      warmup_from_zero: true
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    disc_start: 20
    disc_upd_start: 18
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
