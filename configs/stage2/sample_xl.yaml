stage_1:
  target: stage1.RAE
  ckpt: checkpoints/ssr_stage1.pt
  params:
    encoder_cls: Dinov3withNorm
    encoder_config_path: models/dinov3b
    encoder_input_size: 256
    encoder_params:
      dinov3_path: models/dinov3b
      normalize: true
    decoder_config_path: configs/decoder/ViTXL/config.yaml
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: checkpoints/ssr_latent_stats.pt
stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size: [1152, 2048]
    depth: [28, 2]
    num_heads: [16, 16]
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true
  ckpt: 'checkpoints/ssr_dit_xl.pt'

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [768, 16, 16] # [C, H, W]
  num_classes: 1000
  time_dist_shift_dim: 196608 # 16*16*768
  time_dist_shift_base: 4096
